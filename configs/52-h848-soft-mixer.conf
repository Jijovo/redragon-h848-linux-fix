# WirePlumber rule for Redragon H848 / XiiSound 040b:0897.
#
# The device's USB Feature Unit advertises a bogus 0.00-0.39 dB volume range
# and silences a channel on any volume-register write below maximum.
#
# api.alsa.soft-mixer is a *device* property (match device.name, not node.name),
# so WirePlumber never writes the hardware volume registers and the slider is
# pure software.
#
# This file must be installed BOTH per-user and system-wide:
#   ~/.config/wireplumber/wireplumber.conf.d/52-h848-soft-mixer.conf
#   /etc/wireplumber/wireplumber.conf.d/52-h848-soft-mixer.conf
# The system-wide copy is what stops the display-manager greeter from writing
# the broken registers before you log in.
#
# Covers both card names:
#   H848 Wireless headset      (2.4 GHz dongle)
#   H848 USB Gaming Headset    (USB cable)
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-XiiSound_Technology_Corporation_.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
